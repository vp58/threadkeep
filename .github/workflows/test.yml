name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile conversations/*.py approval/*.py discord-gateway/*.py

      - name: Run tests
        run: python -m unittest discover -s discord-gateway/tests -t discord-gateway -v
