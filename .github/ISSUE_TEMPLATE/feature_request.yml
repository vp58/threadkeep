name: Feature request
description: Suggest an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve, in plain language.
      placeholder: When I have more than 10 parallel threads open, finding the right one is slow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like Disco Party to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they did not fit.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, screenshots, links, or use cases.
    validations:
      required: false
