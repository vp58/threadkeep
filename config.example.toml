# Claude Disclawd configuration.
#
# Copy this file to config.toml and fill in the values for your install.
# Every key here can also be set via an environment variable prefixed with
# DISCLAWD_ (see conversations/config.py for the exact mapping). Env vars
# always win over the TOML file so you can keep secrets out of the repo.

[paths]
# Where conversation transcripts live on disk. Path is expanded with ~.
workspace_root = "~/.claude-disclawd"
conversations_dir = "~/.claude-disclawd/conversations"
# Optional. If unset, each component logs to its own file under the repo.
# log_file = "~/.claude-disclawd/disclawd.log"

[discord]
# Channel id Disclawd listens to. Top-level posts here become new threads.
chat_channel_id = "000000000000000000"
# Channel id Disclawd posts errors and stderr to.
errors_channel_id = "000000000000000000"
# Discord user id of the owner. Only this user can approve outbound sends
# and only their button presses are honored by the router.
owner_user_id = "000000000000000000"
# Env var name the bot token is read from at runtime. Default is fine.
token_env_var = "DISCORD_BOT_TOKEN"
# Optional fallback: a file containing the bot token. Used only if the env
# var is unset. Keep the file out of version control and chmod 600.
# token_file = "~/.config/disclawd/discord-bot-token"

[runtime]
timezone = "UTC"
max_messages_per_minute = 5
max_messages_per_hour = 30
max_concurrent_workers = 3
# Leave false unless you know what you are doing. When true the spawned
# worker subagent runs without permission prompts.
use_dangerously_skip_permissions = false
